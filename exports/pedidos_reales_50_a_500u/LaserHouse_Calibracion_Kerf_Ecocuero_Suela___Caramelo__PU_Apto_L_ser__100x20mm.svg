<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="116mm"
     height="46mm"
     viewBox="0 0 116 46">
  <!-- LaserHouse Studio — Patrón de Calibración de Kerf para Vank 9060 CO2 -->
  <!-- Material de referencia: Ecocuero Suela / Caramelo (PU Apto Láser) -->

  <!-- Capa 00: GRABADO -->
  <g id="CAPA_00_GRABADO">
    <text x="58" y="5" text-anchor="middle" fill="#000000" font-size="2.6" font-family="sans-serif" font-weight="bold">
      CALIBRACION DE KERF LASERHOUSE — ECOCUERO SUELA / CARAMELO (PU APTO LÁSER)
    </text>
    <text x="13" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">1</text>
    <text x="23" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">2</text>
    <text x="33" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">3</text>
    <text x="43" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">4</text>
    <text x="53" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">5</text>
    <text x="63" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">6</text>
    <text x="73" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">7</text>
    <text x="83" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">8</text>
    <text x="93" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">9</text>
    <text x="103" y="19.2" text-anchor="middle" fill="#000000" font-size="3.2" font-family="monospace" font-weight="bold">10</text>
    <text x="58" y="43" text-anchor="middle" fill="#000000" font-size="2.0" font-family="monospace">
      Empujar tablillas a un lado y medir espacio con calibre digital: Kerf = Espacio / 10
    </text>
  </g>

  <!-- Capa 02: CORTE -->
  <g id="CAPA_02_CORTE">
    <!-- Marco perimetral exterior (100 x 20 mm) -->
    <rect x="8" y="8" width="100" height="20" fill="none" stroke="#FF0000" stroke-width="0.2" />
    <!-- 9 líneas de corte internas para separar las 10 tablillas -->
    <line x1="18" y1="8" x2="18" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="28" y1="8" x2="28" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="38" y1="8" x2="38" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="48" y1="8" x2="48" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="58" y1="8" x2="58" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="68" y1="8" x2="68" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="78" y1="8" x2="78" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="88" y1="8" x2="88" y2="28" stroke="#FF0000" stroke-width="0.15" />
    <line x1="98" y1="8" x2="98" y2="28" stroke="#FF0000" stroke-width="0.15" />
  </g>
</svg>